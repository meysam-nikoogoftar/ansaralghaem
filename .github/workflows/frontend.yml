name: Migration security checks
on: [push, pull_request]
env:
  BFF_SHARED_SECRET: ci-only-secret-at-least-thirty-two-characters
  ALLOW_INSECURE_HTTP: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: npm ci --prefix frontend-next
      - run: npm run typecheck --prefix frontend-next
      - run: npm test --prefix frontend-next
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run build --prefix frontend-next
      - run: .venv/bin/python manage.py test accounts shop trips --settings=core.test_settings
        working-directory: backend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend-next
      - run: npm run test:e2e --prefix frontend-next
